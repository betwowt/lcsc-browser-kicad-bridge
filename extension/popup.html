<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>导入到 KiCad</title>
<style>
  :root { color-scheme: light dark; }
  body { width: 320px; margin: 0; padding: 14px; font: 13px/1.5 system-ui, sans-serif; }
  h1 { margin: 0 0 10px; font-size: 14px; }
  input { width: 100%; box-sizing: border-box; padding: 7px 9px; border: 1px solid #8888; border-radius: 6px; font: inherit; }
  button { margin-top: 10px; width: 100%; padding: 8px; border: 0; border-radius: 6px; background: #0759b5; color: #fff; font: 600 14px system-ui, sans-serif; cursor: pointer; }
  button:disabled { opacity: .6; cursor: default; }
  #status { margin: 10px 0 0; min-height: 34px; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 12px; color: #555; }
  .hint { margin: 8px 0 0; font-size: 12px; color: #777; }
</style>
</head>
<body>
<h1>导入到 KiCad 工程</h1>
<input id="part" placeholder="C1688 或商品页链接" autocomplete="off" spellcheck="false">
<button id="import" type="button">导入</button>
<p id="status" role="status" aria-live="polite">输入料号或粘贴立创商品页链接。</p>
<p class="hint">商品页上的「导入」按钮缺失时，可在这里手动导入。endpoint 与 token 在扩展选项中设置。</p>
<script src="popup.js"></script>
</body>
</html>
